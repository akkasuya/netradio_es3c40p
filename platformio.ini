; PlatformIO project: netradio port for LCDWiki ES3C40P
; Board: LCDWiki ES3C40P, ESP32-S3 N16R8 (16MB flash, 8MB OPI PSRAM)
; Display: ST7796S 4.0" 320x480 SPI (same SPI pins as ES3C28P/ILI9341)
; Source: ../es3c28p/netradio (Reveil-CYDGOLD port for ES3C28P)
; HW ref: https://www.lcdwiki.com/4.0inch_ESP32-S3_Display
;   LCD CS=10 RS/DC=46 SCK=12 MOSI=11 MISO=13 BL=45 (identical to ES3C28P)
;   Touch FT6336U I2C SDA=16 SCL=15 RST=18 INT=17 addr 0x38 (identical)
;   Audio ES8311: PA=IO1 MCK=IO4 BCK=IO5 WS/LRC=IO7,
;     NOTE speaker data DO=IO6 on ES3C40P (was DOUT=IO8 on ES3C28P).
;     If no sound, try swapping I2S_DOUT back to 8 in src/config.h.
;   SD SPI mode SCK=38 MISO=39 MOSI=40 CS=47 (same workaround as ES3C28P).
;   LED=42, BOOT=0, BAT ADC=9 (identical).

[env:es3c40p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- 16MB flash + 8MB OPI PSRAM (N16R8) ---
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_16MB_cyd.csv
board_build.filesystem = littlefs

; --- USB CDC (native USB-C, serial + upload) ---
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
upload_speed = 921600

build_flags =
  -I include
  -I src
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  ; --- Compile-time WiFi seed (used once when no network is stored) ---
  -DWIFI_SEED_SSID='"DRBOM"'
  -DWIFI_SEED_PASS='"55555555"'
  ; --- LVGL 8 config ---
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  ; --- TFT_eSPI driver setup via build flags (no User_Setup.h file) ---
  -DUSER_SETUP_LOADED
  -DST7796_DRIVER
  -DUSE_FSPI_PORT
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=46
  -DTFT_RST=-1
  -DTFT_MISO=13
  -DTFT_BL=45
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD
  -DLOAD_FONT
  -DLOAD_GFXFF
  -DSMOOTH_FONT

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^8.3.11
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.6
  adafruit/RTClib@^2.1.4
  bblanchon/ArduinoJson@^7.4.3
